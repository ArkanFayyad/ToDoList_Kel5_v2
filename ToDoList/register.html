<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList - Daftar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="fas fa-tasks"></i> <!-- Ikon lebih premium -->
                <h1>ToDoList</h1>
            </div>
            <p class="subtitle">Mulai kelola tugasmu sekarang</p>
            
            <form id="registerForm" class="auth-form">
                <div class="input-wrapper">
                    <input type="text" id="registerUsername" placeholder="Username" required maxlength="20">
                    <i class="fas fa-user"></i>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="registerPassword" placeholder="Password (min 4 karakter)" required minlength="4">
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="btn-primary full-width">
                    <i class="fas fa-user-plus"></i>
                    Daftar
                </button>
            </form>
            
            <div class="auth-links">
                <p>Sudah punya akun? <a href="login.html">Masuk sekarang</a></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
